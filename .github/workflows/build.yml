name: Build and smoke test

on:
  push:
    branches: [main, unstable, dev]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: minimal
          load: true
          push: false
          tags: oapif-go:ci
          build-args: |
            DUCKDB_VERSION=v1.5.3
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name oapif \
            -e S3_ENDPOINT=${{ secrets.S3_ENDPOINT }} \
            -e S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }} \
            -e S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }} \
            -e S3_BUCKET=${{ vars.S3_BUCKET }} \
            -e SERVER_URL=http://localhost:5000 \
            -e COLLECTION_ID=test \
            -e COLLECTION_PARQUET_KEY=${{ vars.S3_TEST_PARQUET_KEY }} \
            -p 5000:5000 \
            oapif-go:ci

      - name: Wait for server
        run: |
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/collections > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Test endpoints
        run: |
          echo "=== /collections ==="
          curl -sf http://localhost:5000/collections | jq .

          echo "=== /collections/test/items?limit=3 ==="
          curl -sf "http://localhost:5000/collections/test/items?limit=3" | jq '{type,numberMatched,numberReturned}'

      - name: Print startup logs
        if: always()
        run: docker logs oapif

  push-to-ghcr:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: gateway
          push: true
          tags: |
            ghcr.io/waystones-nexus/oapif-go:latest
            ghcr.io/waystones-nexus/oapif-go:${{ github.sha }}
          build-args: |
            DUCKDB_VERSION=v1.5.3
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-to-cloudflare:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/unstable'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Determine image name
        id: image
        run: |
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "name=waystones-keystone-oapifgo:2026-06-16f" >> $GITHUB_OUTPUT
          else
            echo "name=waystones-shard-oapifgo:2026-06-16f" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: minimal
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}
          build-args: |
            DUCKDB_VERSION=v1.5.3
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: containers push ${{ steps.image.outputs.name }}
